# Builds the release assets from a tag and attaches them together with a
# provenance attestation, so anyone can verify with `gh attestation verify`
# that main.js and styles.css were built by this workflow from this repository
# rather than uploaded by hand.
#
#   git tag 1.0.1 && git push origin 1.0.1
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  # Required to mint the attestation.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 rather than 20, which is end-of-life. Safe for the one property
      # this workflow exists to protect: 1.0.2 was built here on Node 20 and
      # locally on Node 24, and main.js and styles.css came out byte-identical,
      # so the bundle does not depend on the version of Node that built it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Builds main.js and styles.css, typechecks, then runs the no-remote-code
      # gate and the smoke test. A tag that does not pass is not released.
      - run: npm test

      # The tag must be the version the plugin will report, or Obsidian will
      # install one thing and name another.
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      # Release notes come from CHANGELOG.md, so the description that ships with
      # the release and the one in the repository cannot drift apart. A version
      # with no section is an error: a release with no notes tells a user
      # nothing about what changed.
      - name: Extract the release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            main.js manifest.json styles.css
