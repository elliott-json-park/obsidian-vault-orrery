<!doctype html>
<meta charset="utf-8">
<title>engine harness</title>
<!-- Mounts src/engine.generated.js the way the plugin does — inside a sized
     container, with $() scoped to it and the viewport rewritten to its box —
     so the module the plugin actually loads can be exercised without Obsidian.
     Not shipped; scratch rig. -->
<style>
  html,body{margin:0;height:100%;background:#05080f}
  /* stands in for the Obsidian leaf's content element */
  #leaf{position:absolute;inset:32px;border:1px solid #234}
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js" } }
</script>
<div id="leaf"></div>
<script type="module">
const log = [];
window.__log = log;
window.onerror = (m, s, l) => log.push(`onerror ${m} @${l}`);

/* ?shim drives the frame loop off timers instead of the compositor, and
   reports what a frame threw. A browser pane that is not being displayed
   never delivers requestAnimationFrame, so without this the render path
   cannot be exercised here at all — which is exactly the path that needs
   exercising. */
if (location.search.includes('shim')) {
  let id = 0; const live = new Map();
  window.requestAnimationFrame = cb => {
    const h = ++id;
    live.set(h, setTimeout(() => {
      live.delete(h);
      try { cb(performance.now()); }
      catch (e) { log.push(`FRAME THREW: ${e.message} | ${(e.stack||'').split('\n').slice(1,4).join(' <- ')}`); }
    }, 16));
    return h;
  };
  window.cancelAnimationFrame = h => { const t = live.get(h); if (t) { clearTimeout(t); live.delete(h); } };
  Object.defineProperty(document, 'hidden', { configurable: true, get: () => false });
  Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => 'visible' });
}

const { createOrrery, ENGINE_HTML } = await import('/src/engine.generated.js');

/* The same stylesheet Obsidian loads, generated alongside the engine module. */
const link = document.createElement('link');
link.rel = 'stylesheet';
link.href = '/styles.css';
document.head.appendChild(link);

const host = document.getElementById('leaf');
const root = document.createElement('div');
root.className = 'vo-root';
host.appendChild(root);
const doc = new DOMParser().parseFromString(ENGINE_HTML, 'text/html');
while (doc.body.firstChild) root.appendChild(doc.body.firstChild);

let api = null;
try { api = createOrrery(root); log.push('created'); }
catch (e) { log.push('createOrrery: ' + e.message + ' | ' + (e.stack||'').split('\n')[1]); }
window.__api = api;

const mk = (path, text, meta) => ({ path, file: { text: async () => text }, meta });
const FILES = [
  mk('research/quantum.md', '# Quantum\n[[research/optics]] [[notes/daily]]\n2024-01-04'),
  mk('research/optics.md',  '# Optics\n[[research/quantum]]\n2024-02-11'),
  mk('research/lasers.md',  '# Lasers\n[[research/optics]]\n2024-02-20'),
  mk('notes/daily.md',      '# Daily\n[[research/optics]]\n2024-03-01'),
  mk('notes/ideas.md',      '# Ideas\n[[notes/daily]] [[research/quantum]]\n2024-04-09'),
  mk('notes/reading.md',    '# Reading\n[[notes/ideas]]\n2024-04-22'),
  mk('archive/old.md',      '# Old\nno links\n2023-06-01'),
  /* Host metadata, the way Obsidian supplies it: links already resolved (this
     one is written through an alias the engine's own parser cannot follow) and
     tags from the body rather than the front matter. */
  mk('notes/aliased.md', '# Aliased\nsee [[The Optics Note]] #field/optics\n2024-05-02',
     { links: { 'research/optics.md': 1 }, broken: 0, tags: ['field/optics'] }),
];

window.__run = async () => {
  const step = async (name, fn) => {
    try { await fn(); log.push('ok ' + name); }
    catch (e) { log.push(`FAIL ${name}: ${e.message} | ${(e.stack||'').split('\n')[1]}`); }
  };
  await step('setHosted',        () => api.setHosted(true));
  await step('setLang',          () => api.setLang('en'));
  await step('setMaxNodes',      () => api.setMaxNodes(3000));
  await step('setIgnoreFilters', () => api.setIgnoreFilters([]));
  await step('setVisible',       () => api.setVisible(true));
  await step('resize',           () => api.resize());
  await step('load',             () => api.load(FILES, 'demo-vault'));

  /* ---- the host seam ----
     The half of the API Obsidian drives. None of it can be exercised by the
     build or the smoke test: every one of these runs against a live scene
     graph, and three of them are read back out of a frame. */
  const opened = [];
  await step('setHostHooks',  () => api.setHostHooks({ open: (p, o) => opened.push([p, o]) }));
  await step('open button shown', () => {
    const el = root.querySelector('#i-open');
    if (!el || el.style.display === 'none') throw new Error('#i-open still hidden with a host hook set');
  });
  await step('revealPath',    () => {
    if (!api.revealPath('research/optics.md')) throw new Error('known note not found');
    if (api.revealPath('nowhere/at-all.md')) throw new Error('unknown note reported as found');
  });
  await step('open the revealed note', () => {
    root.querySelector('#i-open').click();
    if (opened.length !== 1) throw new Error('host hook was not called');
    if (opened[0][0] !== 'research/optics.md') throw new Error('opened ' + opened[0][0]);
  });
  await step('setActivePath', () => {
    api.setActivePath('notes/daily.md');
    const d = api.debug();
    if (d.active < 0) throw new Error('the active note did not resolve to a body');
    if (d.active === d.selected) throw new Error('active and selected must be independent');
    api.setActivePath('');
    if (api.debug().active !== -1) throw new Error('clearing left a mark behind');
    api.setActivePath('notes/daily.md');
  });
  await step('commands',      () => {
    const names = api.commands();
    if (!names.includes('mindmap')) throw new Error('no mindmap command');
    if (api.command('nope')) throw new Error('unknown command reported as run');
    api.command('mindmap'); api.command('mindmap');    // open and close again
  });
  /* Aliased links are the whole reason the host's own reading beats the
     engine's. If this drops to 1 the metadata path has stopped being used. */
  await step('host metadata', () => {
    if (!api.revealPath('notes/aliased.md')) throw new Error('the aliased note is missing');
    const links = root.querySelector('#i-links').textContent;
    if (!/optics/i.test(links)) throw new Error('the alias link did not resolve: ' + links);
    if (!/optics/i.test(root.querySelector('#i-tags').textContent)) throw new Error('body tag missing');
  });
  /* A reload the user did not ask for must not move the camera. */
  await step('quiet reload keeps the view', async () => {
    api.revealPath('research/lasers.md');
    const before = api.debug();
    const cam = root.querySelector('#s-dist').textContent;
    await api.load(FILES, 'demo-vault', { quiet: true });
    const after = api.debug();
    if (after.nodes !== before.nodes) throw new Error('node count changed');
    if (root.querySelector('#load').classList.contains('on')) throw new Error('curtain shown on a quiet load');
    /* Both marks are held by path across the rebuild; an index kept instead
       would land on whatever note happens to sit at that number afterwards. */
    if (after.selected !== before.selected) throw new Error('the selection moved');
    if (after.active !== before.active) throw new Error('the active mark moved');
    if (!/lasers/.test(root.querySelector('#i-name').textContent))
      throw new Error('the inspector is showing ' + root.querySelector('#i-name').textContent);
    log.push('   range before ' + cam + ' after ' + root.querySelector('#s-dist').textContent);
  });
  return log;
};
</script>
